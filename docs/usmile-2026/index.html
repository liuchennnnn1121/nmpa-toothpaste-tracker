        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function norm(value) {
      return String(value || "").toLowerCase();
    }

    function countByMonth(list) {
      const counts = new Map(DATA.monthly_trend.map(item => [item.month, 0]));
      for (const product of list) {
        counts.set(product.month, (counts.get(product.month) || 0) + 1);
      }
      return DATA.monthly_trend.map(item => ({
        month: item.month,
        filing_count: counts.get(item.month) || 0
      }));
    }

    function productMatches(product) {
      if (state.month !== "all" && product.month !== state.month) return false;
      if (state.factory !== "all" && !product.factoryNames.includes(state.factory)) return false;
      if (!state.q) return true;
      const haystack = [
        product.product_name,
        product.filing_no,
        product.filer,
        product.filer_address,
        product.factory_info_raw,
        product.ingredients_over_0_1,
        product.trace_ingredients,
        product.warnings,
        product.factoryNames.join(" ")
      ].join(" ").toLowerCase();
      return haystack.includes(state.q);
    }

    function filteredProducts() {
      return products.filter(productMatches);
    }

    function setupControls() {
      els.subtitle.textContent = `国家药监局国产牙膏备案信息 · 截至 ${DATA.as_of} · 抓取 ${DATA.captured_at}`;
      els.monthSelect.innerHTML = [
        `<option value="all">全部月份</option>`,
        ...DATA.monthly_trend.map(item => `<option value="${esc(item.month)}">${esc(item.month)} · ${item.filing_count}</option>`)
      ].join("");
      const factoryNames = DATA.factory_summary.map(item => item.factory_name);
      els.factorySelect.innerHTML = [
        `<option value="all">全部加工厂</option>`,
        ...factoryNames.map(name => `<option value="${esc(name)}">${esc(name)}</option>`)
      ].join("");
      els.searchInput.addEventListener("input", event => {
        state.q = norm(event.target.value.trim());
        render();
      });
      els.monthSelect.addEventListener("change", event => {
        state.month = event.target.value || "all";
        render();
      });
      els.factorySelect.addEventListener("change", event => {
        state.factory = event.target.value || "all";
        render();
      });
      els.resetBtn.addEventListener("click", () => {
        state.q = "";
        state.month = "all";
        state.factory = "all";
        els.searchInput.value = "";
        els.monthSelect.value = "all";
        els.factorySelect.value = "all";
        render();
      });
      els.closeDrawer.addEventListener("click", closeDrawer);
      els.drawerBackdrop.addEventListener("click", closeDrawer);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeDrawer();
      });
      els.copySummaryBtn.addEventListener("click", async () => {
        const text = `usmile/笑容加 2026国产牙膏备案：唯一备案号${DATA.unique_filing_count}条；月度趋势 ${DATA.monthly_trend.map(item => item.month + ':' + item.filing_count).join('，')}；Top加工厂：${DATA.factory_summary.filter(item => item.factory_name !== missingFactoryLabel).slice(0, 3).map(item => item.factory_name + item.product_count + '条').join('，')}。`;
        try {
          await navigator.clipboard.writeText(text);
          els.copySummaryBtn.textContent = "已复制";
          setTimeout(() => els.copySummaryBtn.textContent = "复制摘要", 1200);
        } catch {
          els.copySummaryBtn.textContent = "复制失败";
          setTimeout(() => els.copySummaryBtn.textContent = "复制摘要", 1200);
        }
      });
    }

    function renderMetrics(list) {
      const factorySet = new Set();
      for (const product of list) {
        for (const factory of product.factoryNames) {
          if (factory !== missingFactoryLabel) factorySet.add(factory);
        }
      }
      const packageCount = list.reduce((sum, product) => sum + (product.package_items || []).length, 0);
      const previewCount = list.filter(product => product.preview_3d_image).length;
      els.metricProducts.textContent = list.length;
      els.metricFactories.textContent = factorySet.size;
      els.metricPackages.textContent = packageCount;
      els.metricMissing.textContent = previewCount;
      els.metricRange.textContent = state.month === "all" ? "2026-01 至 2026-08" : state.month;
    }

    function renderTrend(list) {
      const trend = countByMonth(list);
      const width = 760;
      const height = 280;
      const margin = { top: 24, right: 20, bottom: 44, left: 48 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const max = Math.max(1, ...trend.map(item => item.filing_count), ...DATA.monthly_trend.map(item => item.filing_count));
      const x = index => margin.left + (trend.length === 1 ? plotW / 2 : (plotW / (trend.length - 1)) * index);
      const y = value => margin.top + plotH - (value / max) * plotH;
      const points = trend.map((item, index) => `${x(index)},${y(item.filing_count)}`).join(" ");
      const yTicks = Array.from({ length: max + 1 }, (_, value) => value);
      els.trendChart.innerHTML = `
        <svg class="trend-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="2026每月备案数量趋势图">
          <rect x="${margin.left}" y="${margin.top}" width="${plotW}" height="${plotH}" fill="#fbfdff" stroke="#d7e1e8" pointer-events="none" />
          ${yTicks.map(value => `
            <line x1="${margin.left}" x2="${width - margin.right}" y1="${y(value)}" y2="${y(value)}" stroke="#e6edf2" pointer-events="none" />
            <text x="${margin.left - 12}" y="${y(value) + 4}" text-anchor="end" font-size="11" fill="#65758a">${value}</text>
          `).join("")}
          <polyline points="${points}" fill="none" stroke="#0f6f83" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" pointer-events="none" />
          ${trend.map((item, index) => `
            <g class="trend-point" data-month="${esc(item.month)}" aria-pressed="${state.month === item.month}" tabindex="0" role="button">
              <rect x="${x(index) - 24}" y="${margin.top}" width="48" height="${plotH}" fill="transparent" pointer-events="all" />
              <circle cx="${x(index)}" cy="${y(item.filing_count)}" r="7" fill="${state.month === item.month ? "#b7791f" : "#ffffff"}" stroke="#0f6f83" stroke-width="3" />
              <text x="${x(index)}" y="${y(item.filing_count) - 14}" text-anchor="middle" font-size="12" fill="#17212b">${item.filing_count}</text>
              <text x="${x(index)}" y="${height - 18}" text-anchor="middle" font-size="11" fill="#65758a">${item.month.slice(5)}</text>
            </g>
          `).join("")}
          <text x="${width / 2}" y="18" text-anchor="middle" font-size="13" fill="#17212b">备案数量</text>
        </svg>
      `;
      els.trendChart.querySelectorAll(".trend-point").forEach(node => {
        const update = () => {
          const month = node.dataset.month;
          state.month = state.month === month ? "all" : month;
          els.monthSelect.value = state.month;
          render();
        };
        node.addEventListener("click", update);
        node.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            update();
          }
        });
      });
    }

	    function renderFactoryBars() {
      const factories = DATA.factory_summary;
      const max = Math.max(1, ...factories.map(item => item.product_count));
      els.factoryBars.innerHTML = factories.map(item => {
        const selected = state.factory === item.factory_name;
        const width = Math.max(4, Math.round((item.product_count / max) * 100));
        return `
          <button class="factory-row" type="button" data-factory="${esc(item.factory_name)}" aria-pressed="${selected}">
            <span class="factory-name" title="${esc(item.factory_name)}">${esc(item.factory_name)}</span>
            <span class="bar-track" aria-hidden="true"><span class="bar-fill" style="width:${width}%"></span></span>
            <span class="count">${item.product_count}</span>
          </button>
        `;
      }).join("");
      els.factoryBars.querySelectorAll(".factory-row").forEach(button => {
        button.addEventListener("click", () => {
          const factory = button.dataset.factory;
          state.factory = state.factory === factory ? "all" : factory;
          els.factorySelect.value = state.factory;
          render();
        });
	      });
	    }

	    function previewThumb(product) {
	      if (product.preview_3d_image) {
	        return `<img class="product-thumb" src="${esc(product.preview_3d_image)}" alt="${esc(product.product_name)}立体图" loading="lazy" />`;
	      }
	      return `<span class="product-thumb placeholder">无图</span>`;
	    }

	    function renderRows(list) {
	      els.resultCount.textContent = `${list.length} 条`;
	      els.emptyState.hidden = list.length > 0;
	      els.productRows.innerHTML = list.map(product => {
        const factoryHtml = product.factoryNames.map(name => `<span class="pill ${name === missingFactoryLabel ? "warn" : ""}">${esc(name)}</span>`).join("");
        const packageCount = (product.package_items || []).length;
        const packageLabel = packageCount ? `${packageCount} 个链接` : "未返回";
        const packageClass = packageCount ? "pill" : "pill warn";
	        return `
	          <tr>
	            <td>${esc(product.filing_date || "-")}</td>
	            <td class="product-name">
	              <div class="product-cell">
	                ${previewThumb(product)}
	                <div class="product-title">${esc(product.product_name)}<div class="muted">${esc(product.month || "")}</div></div>
	              </div>
	            </td>
	            <td>${esc(product.filing_no)}</td>
	            <td>${esc(product.filer || "-")}</td>
	            <td>${factoryHtml}</td>
            <td><span class="${packageClass}">${esc(packageLabel)}</span></td>
            <td><button class="detail-btn" type="button" data-index="${product.index}">详情</button></td>
          </tr>
        `;
      }).join("");
      els.productRows.querySelectorAll(".detail-btn").forEach(button => {
        button.addEventListener("click", () => openDrawer(products[Number(button.dataset.index)]));
      });
    }

    function detailRow(label, value) {
      return `<dt>${esc(label)}</dt><dd>${value ? esc(value) : '<span class="muted">-</span>'}</dd>`;
    }

	    function openDrawer(product) {
	      els.drawerTitle.textContent = product.product_name;
	      els.drawerSub.textContent = `${product.filing_date} · ${product.filing_no}`;
      const factories = product.manufacturing_factories || [];
      const factoryText = factories.length
        ? factories.map(item => `${item.enterprise_name}｜${item.production_license || "无许可证号"}｜${item.production_address || "无生产地址"}`).join("\n")
        : "官方生产企业字段未返回";
	      const packageLinks = (product.package_items || []).length
	        ? (product.package_items || []).map((item, index) => `
	          <a class="package-link" href="${esc(item.preview_link)}" target="_blank" rel="noreferrer">
	            <span>${esc(item.category || `包装附件 ${index + 1}`)}</span>
	            <span>打开</span>
	          </a>
	        `).join("")
	        : `<div class="text-block">官方包装子表未返回</div>`;
	      const previewPanel = product.preview_3d_image
	        ? `<a class="drawer-preview" href="${esc(product.preview_3d_image)}" target="_blank" rel="noreferrer">
	            <img src="${esc(product.preview_3d_image)}" alt="${esc(product.product_name)}立体图" />
	            <span>产品立体图预览</span>
	          </a>`
	        : `<div class="text-block">本地未取得产品立体图预览</div>`;
	      els.drawerBody.innerHTML = `
	        ${previewPanel}
	        <dl class="detail-grid">
	          ${detailRow("备案人", product.filer)}
          ${detailRow("备案人地址", product.filer_address)}
          ${detailRow("加工厂", product.factoryNames.join("；"))}
          ${detailRow("保质期", product.shelf_life)}
          ${detailRow("警示语", product.warnings)}
        </dl>
        <h3 class="section-title">加工厂信息</h3>
        <div class="text-block">${esc(factoryText)}</div>
        <h3 class="section-title">0.1%以上成分</h3>
        <div class="text-block">${esc(product.ingredients_over_0_1 || "官方全成分子表未返回")}</div>
        <h3 class="section-title">其他微量成分</h3>
        <div class="text-block">${esc(product.trace_ingredients || "-")}</div>
        <h3 class="section-title">包装链接</h3>
        <div class="link-list">${packageLinks}</div>
        <div class="source-row">
          <a href="${esc(product.source_detail_url)}" target="_blank" rel="noreferrer">官方详情页</a>
          ${(product.existing_package_images || []).length ? `<span class="pill">${product.existing_package_images.length} 张本地包装截图</span>` : ""}
        </div>
      `;
      document.body.classList.add("drawer-open");
      els.drawer.setAttribute("aria-hidden", "false");
    }

    function closeDrawer() {
      document.body.classList.remove("drawer-open");
      els.drawer.setAttribute("aria-hidden", "true");
    }

    function render() {
      const list = filteredProducts();
      renderMetrics(list);
      renderTrend(list);
      renderFactoryBars();
      renderRows(list);
    }

    setupControls();
    render();
  </script>
</body>
</html>
